name: Firmware

# Builds the T-Beam Supreme firmware for both LoRa variants. On every push
# to master and every PR the build job runs as a sanity check. Pushing a
# `v*` tag additionally publishes a GitHub Release with both .bin files
# attached and auto-generated release notes drawn from the commits + PRs
# since the previous tag.

on:
  push:
    branches: [master]
    tags:     ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env:     ttgo-t-beam-supreme
            variant: tbeam_supreme
            label:   sx1262
          - env:     ttgo-t-beam-supreme-lr1121
            variant: tbeam_supreme_lr1121
            label:   lr1121

    steps:
      # The firmware's platformio.ini symlinks microReticulum and
      # microStore from sibling directories (../microReticulum,
      # ../microStore), so all three repos live under the workspace
      # root. The default checkout path is GITHUB_WORKSPACE; we use
      # `path:` to put each repo where the build expects it.
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: firmware
          fetch-depth: 0   # need full history for the release-notes step

      # microReticulum and microStore both carry local ur-patches branches
      # on top of attermann's master — frequently-rebasing patch series
      # that haven't (yet) landed upstream. The forks under benagricola/
      # mirror attermann's repos with the patches applied on `ur-patches`.
      - name: Checkout microReticulum
        uses: actions/checkout@v4
        with:
          repository: benagricola/microReticulum
          ref:        ur-patches
          path:       microReticulum

      - name: Checkout microStore
        uses: actions/checkout@v4
        with:
          repository: benagricola/microStore
          ref:        ur-patches
          path:       microStore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PlatformIO downloads the espressif32 platform (~250 MB), the
      # ESP-IDF / Arduino frameworks, and the lib_deps tarballs on
      # first build. Cache them across runs so subsequent CI is
      # bound by compile time, not network.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            firmware/.pio/libdeps
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      # The output binary is named rnode_firmware_<custom_variant>.bin
      # by extra_script.py. Stage it under a release-friendly filename
      # before uploading so the artifact reflects the device variant
      # rather than the upstream RNode legacy.
      - name: Stage release artifacts
        id: stage
        working-directory: firmware
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="$(git rev-parse --short HEAD)"
          fi
          bd=".pio/build/${{ matrix.env }}"
          src="$bd/rnode_firmware_${{ matrix.variant }}.bin"
          base="urSupreme-${{ matrix.label }}-${ver}"
          mkdir -p ../release
          # App-only image: drop this at flash offset 0x10000 with
          # esptool for OTA-style upgrades on a device whose
          # bootloader is already up to date.
          cp "$src" "../release/${base}.bin"
          # Symbolicated crash dumps need the .elf.
          elf="$bd/rnode_firmware_${{ matrix.variant }}.elf"
          [[ -f "$elf" ]] && cp "$elf" "../release/${base}.elf"
          # Factory image: one merged blob covering bootloader +
          # partition table + boot_app0 + app, so end users on a
          # blank device can `esptool.py write_flash 0x0 <this>`
          # and not worry about the four-offset choreography.
          # boot_app0 lives inside the arduino-esp32 package install.
          boot_app0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          pip install --quiet esptool
          # --flash-mode keep / --flash-freq keep / --flash-size keep:
          # preserve whatever the PIO-built bootloader.bin has in its
          # header. Overriding to qio here corrupts the bootloader's
          # SPI-mode byte and the chip ends up in a TG0WDT crash loop
          # in the ROM stage. arduino-esp32 v2.x builds the bootloader
          # in DIO mode regardless of board.json's memory_type hint.
          esptool.py --chip esp32s3 merge-bin \
            --output "../release/${base}.factory.bin" \
            --flash-mode keep --flash-freq keep --flash-size keep \
            0x0     "$bd/bootloader.bin" \
            0x8000  "$bd/partitions.bin" \
            0xe000  "$boot_app0" \
            0x10000 "$src"
          # Version-less duplicate of the factory image, only attached
          # on tag pushes. The docs/ web flasher targets
          #   releases/latest/download/urSupreme-<variant>.factory.bin
          # so the manifest stays static across releases instead of
          # needing a code change every tag.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cp "../release/${base}.factory.bin" \
               "../release/urSupreme-${{ matrix.label }}.factory.bin"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.label }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Each variant uploads to its own subdirectory; flatten so
          # `gh release create` gets a single argv list of files.
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # GitHub's own "auto-generated release notes" use the same engine
      # as the web UI's "Generate release notes" button — it lists
      # merged PRs since the previous tag plus first-time contributors.
      # We fall back to a raw `git log` if no PRs are found (e.g. all
      # commits landed straight to master without going through a PR),
      # because the auto-generated notes section is empty in that case.
      - name: Compose release body
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            echo "## Firmware"
            echo
            echo "### SX1262 Supreme V1"
            echo
            echo "- \`urSupreme-sx1262-${tag}.factory.bin\` — full image (bootloader + partitions + app); flash with \`esptool.py --chip esp32s3 -p /dev/ttyACMx write-flash 0x0 urSupreme-sx1262-${tag}.factory.bin\`"
            echo "- \`urSupreme-sx1262-${tag}.bin\` — app-only image for OTA-style upgrades; flash at offset \`0x10000\`"
            echo
            echo "### LR1121 Supreme LR"
            echo
            echo "- \`urSupreme-lr1121-${tag}.factory.bin\` — full image (bootloader + partitions + app); flash with \`esptool.py --chip esp32s3 -p /dev/ttyACMx write-flash 0x0 urSupreme-lr1121-${tag}.factory.bin\`"
            echo "- \`urSupreme-lr1121-${tag}.bin\` — app-only image for OTA-style upgrades; flash at offset \`0x10000\`"
            echo
            echo "\`.elf\` files for each variant are also attached for symbolicated crash-dump analysis."
            echo
            if [[ -n "$prev" ]]; then
              echo "## Changes since \`${prev}\`"
              echo
              git log --pretty=format:'- %s (%h)' "${prev}..${tag}" | grep -v '^- Merge ' || true
              echo
            else
              echo "## Changes"
              echo
              git log --pretty=format:'- %s (%h)' -n 100 "${tag}" | grep -v '^- Merge ' || true
              echo
            fi
          } > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "μRSupreme $GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --verify-tag \
            artifacts/*
