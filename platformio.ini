; MCU: ESP32-S3FN8 Dual-core LX7
; SRAM: 520 KB
; PSRAM: 8 MB
; Flash: 8 MB typical (some variants 16 MB)
; External Flash Interface: N/A
; LoRa: Semtech SX1262
; ===================== arduino-as-component (supreme) =====================
; The two Supreme envs build arduino-esp32 v3.x AS AN IDF COMPONENT on the
; pioarduino fork (the official platformio/espressif32 is archived). This
; unlocks IDF/lwIP/PSRAM sdkconfig tuning (sdkconfig.overrides → regenerated
; into sdkconfig.defaults by extra_script.py) — the WiFi/lwIP-PSRAM SRAM-crash
; knob and the TCP_WND upload-throughput knob both live there. Only the
; Supreme envs use this; all other boards stay on the official platform.
[supreme_base]
; pioarduino 54.03.21-2 = arduino-esp32 3.2.1 + ESP-IDF 5.4.2.
; This release is pinned deliberately: the 55.03.x line bundles tool-cmake 4.0.3,
; whose CMake rejects IDF's scripted `define_property` ("not scriptable") during
; component_get_requirements, failing at the config stage on every IDF 5.5.x
; build. 54.03.21-2 bundles tool-cmake 3.30.2 natively (no override needed), and
; IDF 5.4.2 already exposes every sdkconfig knob we tune below. Don't bump to the
; 55.x line until pioarduino ships a CMake that scripts `define_property` again.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = arduino, espidf
; Strip the heavy managed components arduino-esp32 v3.x pulls in but we don't
; use — faster build, and avoids IDF/PIO CMake-generator bugs (e.g. esp_insights'
; https_server.crt.S that SCons can't emit, breaking the link). littlefs is
; kept (arduino LittleFS uses it, and our microStore PosixFileSystem needs it).
custom_component_remove =
	espressif/esp_insights
	espressif/esp_diagnostics
	espressif/esp_diag_data_store
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/esp_schedule
	espressif/esp_secure_cert_mgr
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp-modbus
	espressif/esp-sr
	espressif/esp-dsp
	espressif/esp_modem
	espressif/esp_rcp_update
	espressif/network_provisioning
	espressif/jsmn
	espressif/json_generator
	espressif/json_parser
	espressif/cbor
	espressif/qrcode
	espressif/libsodium
	chmorgan/esp-libhelix-mp3
	espressif/dl_fft
	espressif/esp-serial-flasher

[env:ttgo-t-beam-supreme]
extends = supreme_base
board = t-beams3-supreme
custom_variant = tbeam_supreme
board_build.partitions = partitions_supreme_8mb.csv
board_build.filesystem = littlefs
build_flags =
	${env.build_flags}
	-DBOARD_MODEL=BOARD_TBEAM_S_V1
	-DMODEM=SX1262
	; Pin the AsyncTCP HTTP task to core 0. Its default core (-1 = any) lets the
	; priority-10 task preempt the priority-1 Arduino loop on core 1; a sustained
	; upload then starves reticulum.loop() + LoRa servicing for seconds and hangs
	; every rns_lock-taking HTTP handler. Core 1 stays the main loop's.
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DBOARD_HAS_PSRAM=1
	-DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
    -DUSTORE_USE_POSIXFS=1
	-DURTN_PATH_TABLE_MAX_RECS=500
	; Path table is a two-tier store: a PSRAM (HeapStore) front that absorbs the
	; announce-rate churn (TTL refreshes are front-only) plus a flash FileStore
	; persist tier (RNS_PERSIST_PATHS) so paths survive a reboot instead of
	; re-learning from announces over ~1 min. The persist tier's compaction — once
	; an O(records) flash rewrite that froze the loop ~18 s and starved LoRa RX — is
	; now incremental: begun on a dead-record threshold and pumped a few records per
	; path put() / Transport::loop() tick, so it never blocks the single-threaded
	; loop. Flip to -URNS_PERSIST_PATHS to drop back to the ephemeral PSRAM-only table.
	-DRNS_PATH_TABLE_SEGMENT_SIZE=24576 ; 24 KB persist-tier segment
	-DRNS_PATH_TABLE_SEGMENT_COUNT=8
	-DTCP_TRANSPORT
	-DHAS_LXMF_GATEWAY=1
	-DLXMF_GATEWAY_MAX_IDENTITIES=4
	-DASYNCWEBSERVER_REGEX=1
lib_deps =
	${env.lib_deps}
	XPowersLib@^0.2.1
	Adafruit_SH110X
	adafruit/Adafruit SH110X@^2.1.14
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	lewisxhe/SensorLib@^0.2.4
	microStore=${libdeps.ustore}
	${libdeps.ur}
	https://github.com/ESP32Async/AsyncTCP.git
	https://github.com/ESP32Async/ESPAsyncWebServer.git

