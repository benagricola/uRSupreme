; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Firmware sources live under src/. This keeps the project root free for the
; IDF project-level CMakeLists.txt while src/ holds the source component —
; the split the arduino-as-component (espidf) build requires. The non-espidf
; envs build the same src/ tree unchanged.
include_dir = src
src_dir = src

; Pinned uR library dependencies, referenced by every env's lib_deps as
; ${libdeps.ur} / ${libdeps.ustore}. Pinned to specific commits on the
; benagricola/ur-patches forks so master builds reproducibly in CI without
; the local sibling checkouts. For local library development, point these
; back at the local symlink:// sibling paths.
[libdeps]
ur     = https://github.com/benagricola/microReticulum.git#41e874624c2d611ca743f65ce0a455c9e66e9ff0
ustore = https://github.com/benagricola/microStore.git#0b53f72b7c8ac1f5b4e28737f3db7bf88d5868a5

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags =
	-std=gnu++11
	-fno-exceptions
build_flags =
	-std=gnu++17
	-fexceptions
	;-O3
	;-O0
	-Os
	-Wall
	;-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Isrc
	; CBA Define following to disable DEBUG build
	-DNDEBUG
	; CBA Define following to include RNS stack
	-DHAS_RNS
	-DRNS_DEBUG_HEAP
	-DRNS_DEBUG_MEMORY
	-DRNS_DEBUG_METRICS
	;-DRNS_DEBUG_PATHSTORE
	-DRNS_USE_FS
	-DRNS_PERSIST_PATHS
	-DRNS_PERSIST_KNOWN_DESTS
	-DMSGPACK_USE_BOOST=OFF
	; Per-row codec scratch-buffer cap inside microStore. Default
	; 1024 is too tight for path-table entries that carry rich
	; announce metadata (display_name + app_data + ratchet keys),
	; which encode to ~1026 B for normal LXMF announces. 4096
	; covers entries up to ~3500 B of raw fields.
	-DUSTORE_MAX_VALUE_LEN=4096
	; CBA Define following to disable LFS asserts
	-DLFS_NO_ASSERT
	; ???
	;-DLFS_YES_TRACE
	; ???
	;-DCORE_DEBUG_LEVEL=5
	; ??? NO
	;-DLOG_LOCAL_LEVEL=5
	;-DCONFIG_LOG_DEFAULT_LEVEL=5
lib_deps = 
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	adafruit/Adafruit SSD1306@^2.5.9
	https://github.com/attermann/Crypto.git
	;https://github.com/attermann/microStore.git
	;${libdeps.ur}
; Exclude directories in root from sources
build_src_filter = +<*> -<variants/>
extra_scripts = pre:extra_script.py

