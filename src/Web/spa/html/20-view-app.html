<div id="view-app" x-data x-show="$store.s.view === 'view-app'" :class="{ 'thread-open': $store.s.openPeer }" x-cloak>
  <header id="topbar">
    <span class="idc" id="self-idc"
          x-data
          x-html="$store.s.self ? identicon($store.s.self.address || $store.s.self.id, 32) : ''"></span>
    <div id="self-info" x-data>
      <div class="name" id="self-name"
           x-text="($store.s.self && $store.s.self.display_name) || '(no name)'"></div>
      <div class="addr" id="self-addr"
           x-text="$store.s.self ? ($store.s.self.address || $store.s.self.id) : ''"></div>
    </div>
    <button class="icon" id="btn-announce-top"
            :data-state="$store.s.ui.announceState"
            :title="$store.s.ui.announceTitle"
            :disabled="!!$store.s.busyButtons['btn-announce-top']"
            @click="forceAnnounce()">
      <!-- megaphone -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
    </button>
    <span id="announce-countdown" class="muted"
          x-show="!!$store.s.ui.announceLabelText"
          x-text="$store.s.ui.announceLabelText"></span>
    <div class="spacer"></div>
    <!-- Main-area view switch (Chats / Map): leftmost of the right cluster,
         set apart by a separator from the popover + action icons. -->
    <div class="view-switch" x-data>
      <button class="icon" id="btn-chats" title="Chats"
              :class="{ active: !$store.s.mapView.open }" @click="closeMapView()">
        <!-- speech bubble -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </button>
      <button class="icon" id="btn-map" title="Map"
              :class="{ active: $store.s.mapView.open }" @click="openMapView()">
        <!-- map -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </button>
    </div>
    <span class="topbar-sep" aria-hidden="true"></span>
    <!-- Radio + transport status indicator. Colored dot overlay shows
         online (green) / offline (red) / not-configured (grey). Click
         to open the status popover below. -->
    <button class="icon" id="btn-status"
            :data-state="$store.s.radioStatus.state"
            :title="$store.s.radioStatus.title"
            @click="onClickStatusBtn()">
      <!-- antenna -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M7.76 7.76a6 6 0 0 0 0 8.48"/><path d="M16.24 7.76a6 6 0 0 1 0 8.48"/><circle cx="12" cy="12" r="2"/></svg>
    </button>
    <button class="icon icon-with-label" id="btn-power"
            x-data="batteryBtnData()"
            x-show="visible"
            x-cloak
            :title="'Battery ' + pct + '% · ' + batteryState"
            @click="onClickPowerBtn()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="18" height="10" rx="1.5"/>
        <line x1="22" y1="11" x2="22" y2="13"/>
        <rect id="btn-power-fill" x="4" y="9" height="6" stroke="none"
              :width="String((pct / 100) * 14)"
              :fill="colour"/>
        <path id="btn-power-bolt" d="M11 9.5 L8.5 13 L11 13 L10 16 L13 12.5 L10.5 12.5 Z" stroke="none"
              x-show="charging" x-cloak
              :fill="colour"/>
      </svg>
      <span class="icon-label" id="btn-power-pct" x-text="pct + '%'"></span>
    </button>
    <button class="icon" id="btn-system" title="System status" @click="onClickSystemBtn()">
      <!-- chip / cpu -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
    </button>
    <button class="icon" id="btn-settings"  title="Settings" @click="openSettingsModal('identity', false)">
      <!-- gear -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon" id="btn-logout"    title="Log out" @click="doLogout($event.currentTarget)">
      <!-- logout: door + arrow -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
    <div id="topbar-progress" aria-hidden="true"
         x-data="topbarProgressData()"
         :class="{ 'is-active': active, 'is-indeterminate': indeterminate }">
      <div class="bar" :style="indeterminate ? '' : ('width:' + barPct + '%')"></div>
    </div>
  </header>
  <!-- Caption for #topbar-progress. Same visibility gate (mobile thread
       view), names what the single aggregate bar is currently moving so
       concurrent inbound/outbound transfers are legible without the
       contact list. -->
  <div id="xfer-caption" x-data="topbarProgressData()"
       :class="{ 'is-active': active }" x-cloak>
    <span x-text="transfersCaption()"></span>
  </div>
  <aside id="pane-list">
    <header id="list-header">
      <input class="flex-1" id="search" placeholder="Search chats and contacts"
             x-model="$store.s.searchQuery">
      <button class="icon" id="btn-new-conv" title="New conversation" @click="openNewConvModal()">
        <!-- new chat: pencil-square -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L13 14l-4 1 1-4 8.5-8.5z"/></svg>
      </button>
    </header>
    <div id="conv-list" x-data x-cloak>
      <!-- Empty state: no chats AND no discovered peers. -->
      <template x-if="convListData().length === 0 && discoveredListData().length === 0 && pendingInboundList().length === 0 && pendingOutboundList().length === 0">
        <div class="empty-state">
          No chats or discovered peers yet. Tap ＋ to start a new conversation, or
          <strong>📣</strong> to announce yourself so others can find you.
        </div>
      </template>

      <!-- Synthetic "Incoming" section: inbound transfers whose sender
           isn't decrypted yet (peer="" in state.transfers). The top-bar
           progress strip alone isn't self-explanatory; this row tells
           the user *what* is happening and clears once `incoming` lands
           and the synthetic row is replaced by a real conversation. -->
      <template x-if="pendingInboundList().length > 0">
        <div class="list-section">Incoming</div>
      </template>
      <template x-for="t in pendingInboundList()" :key="'in:' + (t.bytes_total || 0)">
        <div class="conv-row" data-peer="">
          <span class="idc" x-html="identicon('inbound:' + (t.bytes_total || 0), 44)"></span>
          <div class="middle">
            <div class="name">Incoming attachment</div>
            <div class="last" x-text="incomingSubText(t)"></div>
            <div class="progress-track">
              <div class="progress-fill" :style="'width:' + transferPct(t) + '%'"></div>
            </div>
          </div>
          <div class="meta"><div class="when">now</div></div>
        </div>
      </template>

      <!-- Synthetic "Outgoing" section: outbound attachment transfers in
           flight, mirroring "Incoming" above so a send is as visible as a
           receive even when the recipient's row is scrolled out of view.
           Carries a real data-peer, so the delegated handler opens the
           recipient's chat on click. -->
      <template x-if="pendingOutboundList().length > 0">
        <div class="list-section">Outgoing</div>
      </template>
      <template x-for="t in pendingOutboundList()" :key="'out:' + t.peer + ':' + (t.bytes_total || 0)">
        <div class="conv-row" :data-peer="t.peer">
          <span class="idc" x-html="identicon(t.peer, 44)"></span>
          <div class="middle">
            <div class="name" x-text="'To ' + nameFor(t.peer)"></div>
            <div class="last" x-text="outgoingSubText(t)"></div>
            <div class="progress-track">
              <div class="progress-fill" :style="'width:' + transferPct(t) + '%'"></div>
            </div>
          </div>
          <div class="meta"><div class="when">now</div></div>
        </div>
      </template>

      <!-- Chats section. Rows are keyed by peer hash so Alpine reuses
           DOM across reactive updates - keeps focus + in-flight
           progress bars stable while a transfer ticks. -->
      <template x-if="convListData().length > 0">
        <div class="list-section">Chats</div>
      </template>
      <template x-for="c in convListData()" :key="c.peer">
        <div :class="'conv-row' + (c.peer === $store.s.openPeer ? ' active' : '')"
             :data-peer="c.peer"
             x-show="convRowMatchesSearch(c)">
          <span class="idc"
                :data-online="isPeerOnline(c.peer) ? '' : null"
                x-html="identicon(c.peer, 44)"></span>
          <div class="middle">
            <div class="name" x-text="nameFor(c.peer)"></div>
            <div class="last">
              <template x-if="activeInboundTransferFor(c.peer)">
                <span x-text="convSubText(c)"></span>
              </template>
              <template x-if="!activeInboundTransferFor(c.peer)">
                <span><span x-text="c.last_in === false ? '↑ ' : '↓ '"></span><template x-if="c.last_body"><span x-text="c.last_body"></span></template><template x-if="!c.last_body && c.last_attachments && c.last_attachments.length"><svg class="attach-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span x-text="convAttachmentLabel(c.last_attachments)"></span></template></span>
              </template>
            </div>
            <template x-if="announceSeenString($store.s.announces[c.peer])">
              <div :class="'seen' + (isPeerOnline(c.peer) ? ' online' : '')"
                   x-text="announceSeenString($store.s.announces[c.peer])"></div>
            </template>
            <template x-if="activeInboundTransferFor(c.peer)">
              <div class="progress-track">
                <div class="progress-fill" :style="'width:' + transferPct(activeInboundTransferFor(c.peer)) + '%'"></div>
              </div>
            </template>
          </div>
          <div class="meta">
            <div class="when" x-text="relTime(c.last_ts)"></div>
            <button class="icon row-menu-btn"
                    title="Conversation actions"
                    aria-label="Conversation actions"
                    @click.stop="openRowMenu(c.peer, $event.currentTarget)">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
            </button>
          </div>
        </div>
      </template>

      <!-- Discovered: announces for peers we've never chatted with.
           Wrapped in <details> so the user can collapse the list when
           it gets long. Default-open when there are no chats yet. -->
      <template x-if="discoveredListData().length > 0">
        <details class="list-group" :open="convListData().length === 0">
          <summary class="list-section"
                   x-text="'Discovered (' + discoveredListData().length + ')'"></summary>
          <template x-for="a in discoveredListData()" :key="a.dest">
            <div :class="'conv-row' + (a.dest === $store.s.openPeer ? ' active' : '')"
                 :data-peer="a.dest"
                 x-show="convRowMatchesSearchDiscovered(a)"
                 data-discovered="1">
              <span class="idc"
                    :data-online="isPeerOnline(a.dest) ? '' : null"
                    x-html="identicon(a.dest, 44)"></span>
              <div class="middle">
                <div class="name" x-text="a.display_name || nameFor(a.dest)"></div>
                <div class="last" x-text="(a.aspect && a.aspect !== 'lxmf.delivery') ? a.aspect : ''"></div>
                <template x-if="discoveredAgeLabel(a)">
                  <div :class="'seen' + (isPeerOnline(a.dest) ? ' online' : '')"
                       x-text="discoveredAgeLabel(a)"></div>
                </template>
              </div>
              <div class="meta"><div class="when"></div></div>
            </div>
          </template>
        </details>
      </template>
    </div>
  </aside>
  <section id="pane-thread">
    <header id="thread-header" x-data x-show="$store.s.openPeer" x-cloak>
      <button class="icon btn-back" id="btn-back" title="Back"
              @click="$store.s.openPeer = null">←</button>
      <span class="idc" id="thread-idc"
            x-html="$store.s.openPeer ? identicon($store.s.openPeer, 36) : ''"></span>
      <div class="peer-info">
        <div class="name clickable" id="thread-name" title="Click to rename" 
             x-text="$store.s.openPeer ? nameFor($store.s.openPeer) : ''"
             @click="renamePeerFlow($store.s.openPeer)"></div>
        <div class="addr" id="thread-addr"
             x-text="$store.s.openPeer ? shortHex($store.s.openPeer) : ''"
             :title="$store.s.openPeer"></div>
      </div>
      <button class="icon" id="btn-conv-retention" title="Retention settings"
              @click="$store.s.openPeer && openRetentionModal($store.s.identityId, $store.s.openPeer)">
        <!-- clock -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="icon" id="btn-clear-conv" title="Clear conversation"
              @click="$store.s.openPeer && clearConversationFlow($store.s.openPeer)">
        <!-- trash -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </header>
    <div id="thread-empty" class="empty-state" x-data x-show="!$store.s.openPeer" x-cloak>
      <div>Select a conversation, or start a new one with <strong>＋</strong>.</div>
    </div>
    <!-- Active live-telemetry shares with the open chat. Sending side:
         this device is answering the peer's update requests. Receiving
         side: this device is fetching the peer's readings; the line
         shows the latest values. Stop ends that direction only. -->
    <span class="display-contents" x-data>
      <template x-if="$store.s.openPeer && (telemetryGrantForOpenPeer() || telemetryFeedForOpenPeer())">
        <div class="live-strip">
          <span class="live-dot"></span>
          <span class="live-label">Live updates</span>
          <template x-if="telemetryGrantForOpenPeer()">
            <span class="live-seg">
              <span class="seg-label">Sending</span>
              <template x-for="ico in telemetryGrantIcons()" :key="ico">
                <span :class="ico"></span>
              </template>
              <span class="muted" x-text="_leftText(_shareLeftS(telemetryGrantForOpenPeer()))"></span>
              <button class="secondary" @click="stopTelemetryShare('grant')">Stop</button>
            </span>
          </template>
          <template x-if="telemetryFeedForOpenPeer()">
            <span class="live-seg">
              <span class="seg-label">Receiving</span>
              <template x-for="(l, li) in telemetryFeedLines()" :key="li">
                <span :class="l.ico" x-text="l.txt"></span>
              </template>
              <span class="muted" x-text="telemetryFeedUpdatedText()"></span>
              <span class="muted" x-text="_leftText(_shareLeftS(telemetryFeedForOpenPeer()))"></span>
              <button class="secondary" @click="stopTelemetryShare('feed')">Stop</button>
            </span>
          </template>
        </div>
      </template>
    </span>
    <div id="thread-msgs"
         x-data
         x-show="$store.s.openPeer"
         x-effect="$store.s.openPeer; (currentConv() && currentConv().msgs.length); maybeScrollThreadToBottom()"
         x-cloak>
      <template x-if="$store.s.openPeer && (!currentConv() || currentConv().msgs.length === 0)">
        <div class="empty-state">No messages yet. Say hi.</div>
      </template>
      <template x-for="m in (currentConv() ? currentConv().msgs : [])"
                :key="(m.in ? 'i' : 'o') + ':' + (m.seq || ('h' + (m.received_ms || 0)))">
        <div :class="bubbleClass(m)">
          <template x-if="m.title">
            <div class="font-bold mb-mini" x-text="m.title"></div>
          </template>
          <!-- Only render the body container when there's text - an
               empty <div> still takes ~line-height worth of vertical
               space, which on attachment-only messages shows up as a
               wide gap above the chip. -->
          <template x-if="m.body">
            <div class="whitespace-pre-break" x-text="m.body"></div>
          </template>
          <!-- Attachments: declarative chip / inline-image / inline-
               audio / error / SD-unreachable variants. attachmentMode(a)
               picks one; the appropriate <template x-if> renders it.
               Blob URLs flow via $store.s.attachmentBlobs which the
               loader (loadAttachmentBlob) mutates so x-bind picks up
               the cached URL on completion. -->
          <template x-for="a in (m.attachments || [])"
                    :key="(a.filename || a.display_name || '') + ':' + a.tag">
            <template x-if="attachmentVisible(a)">
              <span class="display-contents" x-data="{ a: a }">
                <template x-if="attachmentMode(a) === 'sd_unreachable'">
                  <div class="chip bg-chip-warn color-inherit mt-6" :class="attachmentIconClass(a)"
            :title="'This attachment was saved on the SD card. Re-insert the card and reboot the device to recover it.'"
            x-text="attachmentLabel(a) + ' (SD card unavailable)'"></div>
                </template>
                <template x-if="attachmentMode(a) === 'click-to-load'">
                  <button class="attachment-chip chip chip-btn" :class="attachmentIconClass(a)"
                          @click="downloadAttachment(state.identityId, a, $event.currentTarget, $event.currentTarget.parentElement)"
                          x-text="attachmentLabel(a) + ' (click to load)'"></button>
                </template>
                <template x-if="attachmentMode(a) === 'click-to-download'">
                  <button class="attachment-chip chip chip-btn" :class="attachmentIconClass(a)"
                          @click="downloadAttachment(state.identityId, a, $event.currentTarget, $event.currentTarget.parentElement)"
                          x-text="attachmentLabel(a) + ' (click to download)'"></button>
                </template>
                <template x-if="attachmentMode(a) === 'static'">
                  <div class="chip mt-6" :class="attachmentIconClass(a)"
            x-text="attachmentLabel(a)"></div>
                </template>
                <template x-if="attachmentMode(a) === 'gpx'">
                  <div class="mt-6" x-init="loadGpxThumb(a)">
                    <template x-if="gpxState(a) === 'loading'">
                      <div class="muted chip ico-pin">Loading track…</div>
                    </template>
                    <template x-if="gpxState(a) === 'failed'">
                      <button class="attachment-chip chip chip-btn ico-pin" @click="loadGpxThumb(a, true)">Track unavailable - retry</button>
                    </template>
                    <template x-if="gpxState(a) === 'ready'">
                      <div class="map-thumb gpx-thumb" @click="openMapView({ gpx: a })" role="button" title="Open track">
                        <img class="gpx-thumb-img" :src="$store.s.gpxThumb[a.filename]" alt="track preview">
                        <button class="gpx-thumb-dl" @click.stop="downloadAttachment(state.identityId, a)" title="Download .gpx">Save</button>
                        <span class="map-thumb-hint gpx-thumb-hint" x-text="a.display_name || 'track'"></span>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="attachmentMode(a) === 'inline-image'">
                  <div class="mt-6" x-init="loadAttachmentBlob(a)">
                    <template x-if="$store.s.attachmentBlobs[a.filename] === 'loading'">
                      <div class="muted chip" :class="attachmentIconClass(a)"
                           x-text="attachmentLabel(a) + ' (loading…)'"></div>
                    </template>
                    <template x-if="isBlobFailed($store.s.attachmentBlobs[a.filename])">
                      <div class="chip-error">
                        <div :class="attachmentIconClass(a)" x-text="attachmentLabel(a) + ' (load failed)'"></div>
                        <div class="muted text-tiny mt-mini" 
                             x-text="$store.s.attachmentBlobs[a.filename] && $store.s.attachmentBlobs[a.filename].error"></div>
                        <button class="ghost mt-6 text-xs" 
                                @click="retryAttachment(a, $event.currentTarget.closest('.bubble'))">Retry</button>
                      </div>
                    </template>
                    <template x-if="typeof $store.s.attachmentBlobs[a.filename] === 'string' && $store.s.attachmentBlobs[a.filename] !== 'loading'">
                      <img class="mt-6 max-w-240 max-h-240 rounded-6 display-block cursor-zoom-in" :src="$store.s.attachmentBlobs[a.filename]"
              
              @click="openImageModal($store.s.attachmentBlobs[a.filename], a)">
                    </template>
                  </div>
                </template>
                <template x-if="attachmentMode(a) === 'inline-audio'">
                  <div class="mt-6" x-init="loadAttachmentBlob(a)">
                    <template x-if="$store.s.attachmentBlobs[a.filename] === 'loading'">
                      <div class="muted chip" :class="attachmentIconClass(a)"
                           x-text="attachmentLabel(a) + ' (loading…)'"></div>
                    </template>
                    <template x-if="isBlobFailed($store.s.attachmentBlobs[a.filename])">
                      <div class="chip-error">
                        <div :class="attachmentIconClass(a)" x-text="attachmentLabel(a) + ' (load failed)'"></div>
                        <div class="muted text-tiny mt-mini" 
                             x-text="$store.s.attachmentBlobs[a.filename] && $store.s.attachmentBlobs[a.filename].error"></div>
                        <button class="ghost mt-6 text-xs" 
                                @click="retryAttachment(a, $event.currentTarget.closest('.bubble'))">Retry</button>
                      </div>
                    </template>
                    <template x-if="typeof $store.s.attachmentBlobs[a.filename] === 'string' && $store.s.attachmentBlobs[a.filename] !== 'loading'">
                      <audio class="max-w-240 display-block" :src="$store.s.attachmentBlobs[a.filename]" controls preload="metadata"
              ></audio>
                    </template>
                  </div>
                </template>
              </span>
            </template>
          </template>
          <!-- Telemetry that rode along in this message - decoded
               readings, one line per sensor group. Shown on BOTH ends
               (the sender sees exactly what went out). The position
               line links to the map. -->
          <template x-if="telemetryLines(m).length > 0">
            <div class="telemetry-block mt-6">
              <template x-for="(l, li) in telemetryLines(m)" :key="li">
                <span class="display-contents">
                  <template x-if="l.latlon">
                    <a class="tline" :class="l.ico" role="button"
                       @click="openMapView({ peer: m.peer, latlon: l.latlon })"
                       x-text="l.txt"></a>
                  </template>
                  <template x-if="!l.latlon">
                    <div class="tline" :class="l.ico" x-text="l.txt"></div>
                  </template>
                </span>
              </template>
              <template x-if="telemetryBubbleAge(m)">
                <div class="tline muted" x-text="telemetryBubbleAge(m)"></div>
              </template>
            </div>
          </template>
          <template x-if="m.tel && telemetryLines(m).length === 0">
            <div class="chip mt-6 ico-activity">Sensor readings</div>
          </template>
          <template x-if="msgMeta(m)">
            <div class="bmeta" x-text="msgMeta(m)"></div>
          </template>
          <!-- In-flight send: a thin bar directly under the status line,
               which itself reads "sending N%" (see msgMeta) while a transfer
               is active. No separate labelled block, so the bubble doesn't
               grow a line as it sends. Clears when the transfer entry is
               removed on terminal status. Outbound only: inbound isn't
               assigned to a conversation until its decrypt completes, so it
               surfaces in the contact list, not here. -->
          <template x-if="!m.in && transferForMsg(m)">
            <div class="progress-track bubble-progress">
              <div class="progress-fill" :style="'width:' + transferPct(transferForMsg(m)) + '%'"></div>
            </div>
          </template>
          <template x-if="!m.in && m.status === 'failed'">
            <button class="ghost mt-1 text-xs"
                    :disabled="!!$store.s.busyButtons['retry-' + m.seq]"
                    x-text="$store.s.busyButtons['retry-' + m.seq] ? 'Retrying…' : 'Retry'"
                    @click="retryFailedMessage(m)"></button>
          </template>
        </div>
      </template>
    </div>
    <footer id="compose" x-data x-show="$store.s.openPeer" x-cloak>
      <button class="icon" id="btn-emoji" title="Emoji" @click="onClickEmoji($event)">
        <!-- smile -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </button>
      <button class="icon" id="btn-attach" title="Attach a file or image"
              @click="$refs.attachFile.value = ''; $refs.attachFile.click()">
        <!-- paperclip -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <button class="icon" id="btn-mic" title="Record audio"
              :class="{ recording: $store.s.ui.micRecording }"
              @click="onClickMic()">
        <!-- microphone -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      </button>
      <button class="icon" id="btn-telemetry" title="Attach position and sensor readings"
              :class="{ 'telemetry-armed': telemetryAttachActive() }"
              @click="toggleTelemetryPopover($event)">
        <!-- map pin -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </button>
      <input id="attach-file" type="file" hidden x-ref="attachFile" @change="onChangeAttachFile($event)">
      <div id="compose-mid">
        <div id="attach-tray" x-data="attachTrayData()" x-show="visible" x-cloak>
          <template x-if="recording">
            <div class="record-chip">
              <span class="record-dot"></span>
              <span class="elapsed" x-text="recordElapsedText"></span>
              <button class="secondary" @click="stopRecording(true)">Stop</button>
              <button class="ghost" @click="stopRecording(false)">Cancel</button>
            </div>
          </template>
          <template x-for="(a, idx) in $store.s.pendingAttachments" :key="idx + ':' + a.filename">
            <div class="attach-chip" :class="attachmentIconClass(a)">
              <span class="label" x-text="a.filename + ' · ' + (a.bytes ? formatBytes(a.bytes.length) : '…')"></span>
              <template x-if="attachEtaText(a)">
                <span class="eta" x-text="attachEtaText(a)"></span>
              </template>
              <span class="drop" title="Drop attachment"
                    @click="$store.s.pendingAttachments.splice(idx, 1)">×</span>
            </div>
          </template>
          <template x-if="telemetryAttachActive()">
            <div class="attach-chip" :title="telemetryChipTitle()">
              <template x-for="ico in telemetryChipIcons()" :key="ico">
                <span :class="ico"></span>
              </template>
              <template x-if="telemetryChipSuffix()">
                <span class="label" x-text="telemetryChipSuffix()"></span>
              </template>
              <span class="drop" title="Remove telemetry"
                    @click="$store.s.forms.compose.telemetry = null; $store.s.popovers.telemetry = false">×</span>
            </div>
          </template>
        </div>
        <textarea id="compose-text" placeholder="Message…" rows="1"
                  :maxlength="$store.s.ui.composeMaxLength"
                  x-model="$store.s.forms.compose.text"
                  @keydown="onComposeKeydown($event)"
                  @input="onComposeInput($event)"></textarea>
        <!-- Live character counter - appears only when the user is
             approaching the cap. The firmware rejects >4096 with 413,
             so we surface the limit visually before they hit send. -->
        <div id="compose-counter" class="muted text-xs text-right mt-mini"
             x-show="$store.s.ui.composeCounterShown"
             :class="{ 'text-danger': $store.s.ui.composeCounterDanger }"
             x-text="$store.s.ui.composeCounter" x-cloak></div>
      </div>
      <button class="icon bg-accent-2 border-color-accent text-default" id="btn-send" title="Send"
              :class="{ 'is-busy': sendBtnBusy() }"
              :disabled="sendBtnBusy()"
              @click="sendMessage()">
        <!-- spinner while an attachment is preparing or the send is in flight -->
        <span class="icon-spinner" x-show="sendBtnBusy()" x-cloak></span>
        <!-- arrow up -->
        <svg x-show="!sendBtnBusy()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </footer>
  </section>
</div>

<!-- ===================== STATUS POPOVER ===================== -->
<!-- Anchored below #btn-status. Not a modal; clicking elsewhere closes
     it. Contents refresh on each open from /api/info. -->
